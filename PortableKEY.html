gd:`<h3>Guida</h3>
<h4>Come iniziare</h4><p>Il file funziona subito, anche vuoto: premi <b>Nuovo</b> e inserisci titolo, email, username, password, URL, gruppo e note. Il pulsante con le frecce nel campo password genera una password casuale; con “Opzioni del generatore” scegli lunghezza, tipi di caratteri (utile per i siti che rifiutano i simboli), esclusione dei caratteri ambigui oppure una frase di parole. Sotto il campo compare un indicatore di robustezza (non blocca nulla) che segnala anche se la password è già usata in altre voci. In alto a destra trovi il selettore della lingua (globo) e l’interruttore tema chiaro/scuro (sole/luna).</p>
<h4>Elenco: ordinare e filtrare</h4><ul><li><b>Menu laterale:</b> <b>Elenco</b> e <b>Riepilogo</b> cambiano vista; sotto, i <b>gruppi</b> con il numero di voci (un clic filtra, un secondo clic toglie il filtro). <b>Ctrl+K</b> porta il cursore nella ricerca. Il riquadro in basso mostra lo stato dell’archivio e i pulsanti <b>Blocca</b> e <b>Sola lettura</b>.</li><li><b>Elenco ridotto:</b> la tabella mostra solo titolo, gruppo, MFA e date, per tenere in vista il minimo indispensabile. Email, username, URL, password e note si vedono aprendo la voce (matita) o si copiano con i pulsanti sulla riga. La ricerca cerca solo in titolo e gruppo, cioè nei dati visibili.</li><li><b>Duplica:</b> il pulsante “Duplica” di una voce apre il modulo con gli stessi dati come nuova voce (titolo “Copia di …”, data di inserimento di oggi, scadenza vuota): modifichi quello che serve e salvi. Se annulli, non viene creato nulla. Ricorda di cambiare la password: due account con la stessa password compaiono come “riutilizzata” nel riepilogo.</li><li><b>Scadenza veloce:</b> sotto le date del modulo, i tasti +30, +60, +90 giorni, +6 mesi e +1 anno compilano la scadenza a partire da oggi.</li><li><b>Selezione multipla:</b> spunta le caselle (o “seleziona tutte” per le voci visibili) per far comparire la barra delle azioni di gruppo: sposta in gruppo, imposta scadenza, elimina. Le azioni valgono solo per le voci selezionate e visibili: se cambi ricerca o filtri, quelle non più visibili vengono deselezionate, così non agisci su ciò che non vedi. L’eliminazione chiede conferma.</li><li><b>Bloc Maiusc:</b> se è attivo mentre scrivi una password nel modulo o la master password, compare un avviso. Si aggiorna alla pressione di un tasto, quindi può comparire solo dopo aver digitato.</li><li><b>Vista dell’elenco:</b> con i due pulsanti in alto a destra, accanto alle schede, scegli tra <b>tabella</b> (ideale con molte voci) e <b>riquadri</b> (comoda su telefono: i pulsanti di copia, modifica ed elimina restano sempre visibili). La scelta viene ricordata; la prima volta, sugli schermi stretti si parte dai riquadri. Nei riquadri trovi “Ordina per” e il pannello “Filtri”. I dati mostrati sono gli stessi della tabella: gli altri campi restano cifrati.</li><li><b>Ordinare:</b> clicca sull’intestazione di una colonna (Titolo, Gruppo, MFA, Inserimento, Scadenza) per ordinarla dalla A alla Z; un secondo clic inverte l’ordine (Z–A). Le celle vuote restano sempre in fondo.</li><li><b>Filtrare:</b> sotto le intestazioni c’è una riga di menu a tendina: scegli un valore per vedere solo le voci che lo contengono. Puoi combinare più filtri con la ricerca testuale; la <b>X</b> a fine riga li azzera tutti. “(vuoto)” mostra le voci in cui quel campo non è compilato.</li></ul>
<h4>Riepilogo di sicurezza</h4><ul><li>Percentuale di account con MFA, con password deboli (meno di 12 caratteri) e con password riutilizzate.</li><li><b>Password riutilizzate</b> e <b>password deboli</b>: due elenchi con i soli titoli degli account interessati, segnalati in rosso con un triangolo di attenzione; le password non vengono mostrate.</li><li><b>Domini email</b>: quanti account usano indirizzi dello stesso dominio, con quanti senza MFA e con password debole.</li><li><b>Scadenze</b> e <b>anzianità delle password</b>, calcolate solo sugli account in cui la data (facoltativa) è presente.</li><li>Con centinaia di voci le tabelle mostrano le prime righe e indicano quante altre restano.</li><li>Per i domini email il programma tiene un’impronta non reversibile di ogni dominio e decifra al massimo un’email per ciascun dominio mostrato (al massimo 15), solo per scriverne il nome: nella scheda compaiono i domini, non gli indirizzi.</li></ul>
<h4>Importare</h4><ul><li><b>CSV / XLSX</b>: usa il modello che puoi scaricare con i pulsanti in fondo a questa guida. Una riga per account; la prima riga contiene i nomi delle colonne (Gruppo, Titolo, Indirizzo email, Username, Password, URL, Note, MFA, Inserimento, Scadenza) e non va modificata. In MFA scrivi Sì oppure No; le date si scrivono AAAA-MM-GG (o GG/MM/AAAA, giorno per primo) e possono restare vuote. Cancella la riga di esempio prima di importare. Sono accettate anche le intestazioni inglesi e quelle dell’export di KeePass.</li><li>Se il file ha solo una colonna “Utente” o “Username” e contiene indirizzi email, questi vengono spostati automaticamente nella colonna Email.</li><li><b>.pwm / TXT / CSV / XLSX cifrati</b>: vengono riconosciuti da soli e ti viene chiesta la password per aprirli.</li></ul>
<h4>Salvare ed esportare</h4><p>Con <b>Salva / Esporta</b> scegli archivio .pwm, TXT, CSV o XLSX. Con l’opzione AES-256 attiva il contenuto è cifrato dentro al file (AES-256-GCM, chiave derivata dalla password con PBKDF2-SHA256, 1.000.000 di iterazioni). Ad ogni salvataggio cifrato ti viene chiesta una password di almeno 12 caratteri (con conferma). Non viene memorizzata da nessuna parte, né nel file né nel browser: dopo l’uso viene dimenticata, quindi conservala tu in un posto sicuro.</p><p>Il salvataggio <b>in chiaro</b> (senza cifratura) richiede di riscrivere un <b>codice casuale</b> mostrato nel dialogo; il file prende il nome <b>password-IN-CHIARO-…</b> per riconoscerlo e va eliminato appena possibile. Se importi un file in un archivio già aperto, un’<b>anteprima</b> mostra le voci nuove, diverse e già presenti prima di unire qualcosa. Il pulsante <b>globo</b> di ogni voce apre il suo sito in una nuova scheda: solo http/https, senza collegamento con questa pagina, con avviso per http, domini con caratteri speciali (possibili imitazioni), indirizzi numerici e credenziali nell’indirizzo.</p><p>Nella finestra della password trovi un indicatore di robustezza (stima indicativa) e il pulsante <b>Genera frase</b>, che crea 8 parole casuali separate da trattini (circa 80 bit): annotala subito, perché non viene salvata. Una password debole richiede una conferma. Prima di salvare in chiaro, senza cifratura, viene mostrato un avviso.</p>
<p>Un file cifrato in CSV o XLSX appare come una sola colonna di testo: non modificarla, altrimenti non si apre più. Gli archivi creati con le versioni precedenti si aprono ancora: all’apertura la pagina ti avvisa e segna le modifiche come da salvare, così basta salvare di nuovo per passare al nuovo formato.</p><p>I file esportati hanno nel nome data e ora (password-AAAA-MM-GG_HH-MM), così puoi conservarne più versioni. Nei CSV e XLSX non cifrati i valori che iniziano con = + - @ vengono preceduti da un apice (') per impedire che Excel li interpreti come formule; l’apice viene tolto automaticamente quando reimporti il file in PortableKEY.</p>
<h4>Sicurezza</h4><ul><li>Lo strumento non usa internet e non invia nulla: i dati restano nel browser finché non li salvi.</li><li><b>Se dimentichi la password non c’è modo di recuperare i dati.</b></li><li>Il file HTML non salva da solo: chiudendo la pagina senza esportare perdi le modifiche.</li><li>Le password copiate vengono rimosse dagli appunti dopo 20 secondi (o subito, se la pagina si blocca per inattività o rilascia i dati). Le password mostrate con l’occhio o dal generatore tornano nascoste dopo 20 secondi.</li><li><b>Blocco rapido:</b> premi due volte <b>Esc</b> (entro mezzo secondo) oppure <b>Ctrl+Maiusc+L</b>. Senza modifiche non salvate i dati vengono rimossi subito dalla pagina; con modifiche compare la schermata di blocco (10 minuti per salvarle). Non è un’autenticazione: “Riprendi” copre soltanto lo schermo.</li><li><b>Sola lettura:</b> il pulsante “Sola lettura” nell’intestazione (o l’interruttore “Sola lettura” quando inserisci la password per aprire un archivio) disattiva modifica, importazione ed esportazione per tutta la sessione: serve per consultare l’archivio su un computer non tuo. Per tornare a modificare devi bloccare e riaprire l’archivio. Le password si possono ancora vedere e copiare.</li><li><b>Solo l’utente:</b> la pagina ignora click e tasti generati da script o estensioni e, a pagina bloccata, accetta solo Riprendi e Salva/Esporta. È un rafforzamento, non una garanzia: un’estensione con permessi elevati o un programma che simula l’input a livello di sistema non si distingue da un utente.</li><li><b>Uso più sicuro:</b> apri il file in una finestra privata o in un profilo del browser dedicato, senza estensioni (un’estensione con accesso alle pagine può leggerne il contenuto; su Firefox le estensioni agiscono anche sui file locali). Attiva la cifratura del disco e, se puoi, disattiva l’ibernazione: le copie temporanee dei dati in memoria non si possono azzerare da una pagina web e potrebbero finire su disco.</li><li><b>Blocco automatico:</b> dopo 2 minuti senza attività la pagina chiude le finestre aperte e, se non hai modifiche non salvate, rilascia i dati (per riaprire l’archivio devi importarlo di nuovo con la password). Se hai modifiche non salvate, per non perderle i dati restano in memoria ma vengono nascosti dietro una schermata di blocco, con un conto alla rovescia: <b>dopo altri 10 minuti</b> (12 in totale senza attività) vengono eliminati anche i dati e le modifiche non salvate. Salva un archivio cifrato prima, oppure riprendi a lavorare. Rilasciare i dati dalla pagina non garantisce la cancellazione fisica dalla memoria, che dipende dal browser.</li><li><b>Scheda in background:</b> se lasci la scheda (cambi scheda o finestra, o minimizzi il browser) per almeno 1 secondo, la sessione va in <b>pausa</b>: i dati restano in memoria ma vengono nascosti e compare la schermata con “Riprendi”. Hai <b>10 minuti dal cambio scheda</b> per riprendere, anche senza modifiche non salvate (così puoi copiare una password e incollarla altrove). Se resti fuori dal tab <b>20 secondi o meno</b> la pagina si riapre da sola, con la ricerca e la posizione di prima; trascorsi i 10 minuti i dati vengono rimossi dalla pagina, comprese le modifiche non salvate. Si somma al blocco per inattività (2 minuti + 10 minuti = 12 minuti nella stessa pagina) e non supera mai i 12 minuti dall’ultima attività. Durante la pausa anche elenco e riepilogo vengono rimossi dalla pagina.</li><li><b>Pagina aperta da un sito:</b> se in alto compare un banner di avviso, il file non è stato aperto dal tuo computer ma da un indirizzo web, e chi gestisce il sito potrebbe averlo modificato. Per dati importanti scarica il file da una fonte fidata, verificane l’hash (vedi README) e aprilo in locale.</li><li>Un indicatore in alto, nell’intestazione a sinistra dei pulsanti, mostra se hai modifiche non salvate oppure l’ora dell’ultimo salvataggio; 15 secondi prima del blocco compare un avviso con il pulsante “Salva ora”. Aprire un archivio non conta come modifica.</li><li><b>Dati sensibili in memoria:</b> mentre l’archivio è aperto password, email, username, URL e note sono tenuti cifrati in memoria con una chiave casuale di sessione e si decifrano solo quando li usi (copia, modifica, esportazione, riepilogo). Titolo, gruppo, MFA e date restano in chiaro perché sono mostrati nell’elenco. È un livello in più (best effort): chi controlla il browser o la pagina può comunque usare le stesse funzioni.</li><li>Una politica di sicurezza dei contenuti (CSP) impedisce alla pagina qualsiasi accesso alla rete.</li><li>Usa una password lunga e conserva più copie dell’archivio.</li></ul>`},

gd:`<h3>Guide</h3>
<h4>Getting started</h4><p>The tool works right away, even empty: press <b>New</b> and enter title, email, username, password, URL, group and notes. The arrows button in the password field generates a random password; with “Generator options” you choose the length, the character types (useful for sites that reject symbols), whether to exclude ambiguous characters, or a word phrase. A strength indicator under the field (it never blocks anything) also tells you if the password is already used in other entries. At the top right you’ll find the language selector (globe) and the light/dark theme switch (sun/moon).</p>
<h4>List: sorting and filtering</h4><ul><li><b>Side menu:</b> <b>List</b> and <b>Summary</b> switch the view; below, the <b>groups</b> with their entry counts (one click filters, a second click removes the filter). <b>Ctrl+K</b> puts the cursor in the search box. The box at the bottom shows the archive status and the <b>Lock</b> and <b>Read only</b> buttons.</li><li><b>Minimal list:</b> the table shows only title, group, MFA and dates, to keep the bare minimum in view. Email, username, URL, password and notes are visible when you open the entry (pencil) or can be copied with the buttons on the row. Search only looks in title and group, the visible data.</li><li><b>Duplicate:</b> the “Duplicate” button on an entry opens the form with the same data as a new entry (title “Copy of …”, added date set to today, expiry empty): change what you need and save. If you cancel, nothing is created. Remember to change the password: two accounts with the same password show up as “reused” in the summary.</li><li><b>Quick expiry:</b> below the dates in the form, the +30, +60, +90 days, +6 months and +1 year buttons fill in the expiry date starting from today.</li><li><b>Multiple selection:</b> tick the boxes (or “select all” for the visible entries) to show the group actions bar: move to group, set expiry, delete. Actions apply only to entries that are both selected and visible: if you change the search or filters, entries that are no longer visible are deselected, so you never act on something you cannot see. Deleting asks for confirmation.</li><li><b>Caps Lock:</b> if it is on while you type a password in the form or the master password, a warning appears. It updates when a key is pressed, so it may only show after you start typing.</li><li><b>List view:</b> with the two buttons at the top right, next to the tabs, choose between <b>table</b> (best with many entries) and <b>cards</b> (handy on a phone: the copy, edit and delete buttons are always visible). Your choice is remembered; the first time, narrow screens start with cards. In cards you get “Sort by” and a “Filters” panel. The data shown is the same as in the table: the other fields stay encrypted.</li><li><b>Sorting:</b> click the header of a column (Title, Group, MFA, Added, Expires) to sort it from A to Z; a second click reverses the order (Z–A). Empty cells always stay at the bottom.</li><li><b>Filtering:</b> below the headers there is a row of dropdowns: pick a value to see only the entries that have it. You can combine several filters with the text search; the <b>X</b> at the end of the row clears them all. “(empty)” shows entries where that field is not filled in.</li></ul>
<h4>Security summary</h4><ul><li>Percentage of accounts with MFA, with weak passwords (under 12 characters) and with reused passwords.</li><li><b>Reused</b> and <b>weak passwords</b>: two lists with only the titles of the affected accounts, flagged in red with a warning triangle; the passwords are never shown.</li><li><b>Email domains</b>: how many accounts use addresses on the same domain, and how many of them lack MFA or have a weak password.</li><li><b>Expirations</b> and <b>password age</b>, computed only on accounts where the (optional) date is present.</li><li>With hundreds of entries the tables show the first rows and tell you how many more remain.</li><li>For email domains the program keeps a one-way fingerprint of each domain and decrypts at most one email per displayed domain (up to 15), only to write its name: the tab shows the domains, not the addresses.</li></ul>
<h4>Importing</h4><ul><li><b>CSV / XLSX</b>: use the template you can download with the buttons at the bottom of this guide. One row per account; the first row holds the column names (Group, Title, Email address, Username, Password, URL, Notes, MFA, Added, Expires) and must not be changed. In MFA write Yes or No; dates are written as YYYY-MM-DD (or DD/MM/YYYY, day first) and may be left empty. Delete the example row before importing. Italian headers and KeePass export headers are also accepted.</li><li>If the file has only a “User” or “Username” column and it contains email addresses, they are moved to the Email column automatically.</li><li><b>Encrypted .pwm / TXT / CSV / XLSX</b>: they are recognized automatically and you are asked for the password to open them.</li></ul>
<h4>Saving and exporting</h4><p>With <b>Save / Export</b> choose the .pwm archive, TXT, CSV or XLSX. With the AES-256 option on, the content is encrypted inside the file (AES-256-GCM, key derived from the password with PBKDF2-SHA256, 1,000,000 iterations). Each encrypted save asks for a password of at least 12 characters (with confirmation). It is not stored anywhere, neither in the file nor in the browser: it is forgotten after use, so keep it somewhere safe.</p><p>Saving <b>in plain text</b> (no encryption) requires retyping a <b>random code</b> shown in the dialog; the file is named <b>password-PLAINTEXT-…</b> so you can recognise it, and should be deleted as soon as possible. When you import a file into an archive that is already open, a <b>preview</b> shows new, different and already-present entries before anything is merged. The <b>globe</b> button on each entry opens its website in a new tab: http/https only, with no link back to this page, with a warning for http, domains with special characters (possible look-alikes), numeric addresses and credentials in the address.</p><p>In the password window you will find a strength indicator (an estimate) and the <b>Generate phrase</b> button, which creates 8 random words separated by hyphens (about 80 bits): write it down right away, because it is not stored. A weak password asks for confirmation. A warning is shown before saving in plain text, without encryption.</p>
<p>An encrypted CSV or XLSX file shows as a single column of text: don’t edit it, or it won’t open anymore. Archives created with earlier versions still open: on opening, the page warns you and marks the changes as unsaved, so saving again is enough to move to the new format.</p><p>Exported files carry the date and time in their name (password-YYYY-MM-DD_HH-MM), so you can keep several versions. In unencrypted CSV and XLSX files, values starting with = + - @ are prefixed with an apostrophe (') so spreadsheets don’t interpret them as formulas; the apostrophe is removed automatically when you re-import the file into PortableKEY.</p>
<h4>Security</h4><ul><li>The tool doesn’t use the internet and sends nothing: data stays in the browser until you save it.</li><li><b>If you forget the password, there is no way to recover the data.</b></li><li>The HTML file doesn’t save by itself: closing the page without exporting loses your changes.</li><li>Copied passwords are removed from the clipboard after 20 seconds (or immediately if the page locks for inactivity or releases the data). Passwords shown with the eye button or by the generator are hidden again after 20 seconds.</li><li><b>Quick lock:</b> press <b>Esc</b> twice (within half a second) or <b>Ctrl+Shift+L</b>. With no unsaved changes the data is removed from the page immediately; with unsaved changes the lock screen appears (10 minutes to save them). It is not authentication: “Resume” only covers the screen.</li><li><b>Read-only:</b> the “Read only” button in the header (or the “Read only” switch when you enter the password to open an archive) disables editing, importing and exporting for the whole session: useful to consult the archive on a computer that is not yours. To edit again you must lock and reopen the archive. Passwords can still be viewed and copied.</li><li><b>User only:</b> the page ignores clicks and keys generated by scripts or extensions and, while locked, accepts only Resume and Save / Export. This is hardening, not a guarantee: an extension with elevated permissions or a program that simulates input at operating-system level cannot be told apart from a user.</li><li><b>Safer use:</b> open the file in a private window or a dedicated browser profile with no extensions (an extension with access to pages can read their content; on Firefox extensions also run on local files). Turn on disk encryption and, if you can, disable hibernation: temporary copies of data in memory cannot be zeroed from a web page and might end up on disk.</li><li><b>Auto-lock:</b> after 2 minutes without activity the page closes open dialogs and, if there are no unsaved changes, releases the data (to reopen the archive you must import it again with the password). If you have unsaved changes, to avoid losing them the data stays in memory but is hidden behind a lock screen, with a countdown: <b>after another 10 minutes</b> (12 in total without activity) the data and the unsaved changes are deleted too. Save an encrypted archive before that, or resume working. Releasing the data from the page does not guarantee physical erasure from memory, which depends on the browser.</li><li><b>Tab in the background:</b> if you leave the tab (switch tab or window, or minimise the browser) for at least 1 second, the session is <b>paused</b>: the data stays in memory but is hidden and the screen with “Resume” appears. You have <b>10 minutes from the tab switch</b> to resume, even with no unsaved changes (so you can copy a password and paste it elsewhere). If you stay away from the tab for <b>20 seconds or less</b> the page reopens by itself, with your previous search and position; after 10 minutes the data is removed from the page, including unsaved changes. It adds to the inactivity lock (2 minutes + 10 minutes = 12 minutes on the same page) and never exceeds 12 minutes from the last activity. During the pause the list and summary are also removed from the page.</li><li><b>Page opened from a website:</b> if a warning banner appears at the top, the file was not opened from your computer but from a web address, and whoever runs the site could have modified it. For important data, download the file from a trusted source, verify its hash (see the README) and open it locally.</li><li>An indicator at the top, in the header to the left of the buttons, shows whether you have unsaved changes, or the time of the last save; 15 seconds before the lock a warning appears with a “Save now” button. Opening an archive does not count as a change.</li><li><b>Sensitive data in memory:</b> while the archive is open, password, email, username, URL and notes are kept encrypted in memory with a random session key and are decrypted only when you use them (copy, edit, export, summary). Title, group, MFA and dates stay in clear because the list shows them. It is an extra layer (best effort): whoever controls the browser or the page can still use the same functions.</li><li>A Content Security Policy (CSP) prevents the page from any network access.</li><li>Use a long password and keep several copies of the archive.</li></ul>`}};
