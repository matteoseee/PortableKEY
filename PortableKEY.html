gd:`<h3>Guida</h3>
<h4>Come iniziare</h4><p>Il file funziona subito, anche vuoto: premi <b>Nuovo</b> e inserisci titolo, email, username, password, URL, gruppo e note. Il pulsante con le frecce nel campo password genera una password casuale di 20 caratteri. In alto a destra trovi il selettore della lingua (globo) e l’interruttore tema chiaro/scuro (sole/luna).</p>
<h4>Elenco: ordinare e filtrare</h4><ul><li><b>Ordinare:</b> clicca sull’intestazione di una qualsiasi colonna per ordinarla dalla A alla Z; un secondo clic inverte l’ordine (Z–A). Le celle vuote restano sempre in fondo.</li><li><b>Filtrare:</b> sotto le intestazioni c’è una riga di menu a tendina: scegli un valore per vedere solo le voci che lo contengono. Puoi combinare più filtri con la ricerca testuale; la <b>X</b> a fine riga li azzera tutti. “(vuoto)” mostra le voci in cui quel campo non è compilato.</li></ul>
<h4>Riepilogo di sicurezza</h4><ul><li>Percentuale di account con MFA, con password deboli (meno di 12 caratteri) e con password riutilizzate.</li><li><b>Email</b>: quanti account dipendono da ciascun indirizzo e dominio. Più è alto, maggiore è l’esposizione se quell’indirizzo viene compromesso.</li><li><b>Username</b>: quali username sono ripetuti su più account; uno username riutilizzato è il primo dato che un attaccante prova ovunque.</li><li><b>Scadenze</b> e <b>anzianità delle password</b>, calcolate solo sugli account in cui la data (facoltativa) è presente.</li><li>Con centinaia di voci le tabelle mostrano le prime righe e indicano quante altre restano.</li></ul>
<h4>Importare</h4><ul><li><b>CSV / XLSX</b>: usa il modello che puoi scaricare con i pulsanti in fondo a questa guida. Una riga per account; la prima riga contiene i nomi delle colonne (Gruppo, Titolo, Indirizzo email, Username, Password, URL, Note, MFA, Inserimento, Scadenza) e non va modificata. In MFA scrivi Sì oppure No; le date si scrivono AAAA-MM-GG (o GG/MM/AAAA, giorno per primo) e possono restare vuote. Cancella la riga di esempio prima di importare. Sono accettate anche le intestazioni inglesi e quelle dell’export di KeePass.</li><li>Se il file ha solo una colonna “Utente” o “Username” e contiene indirizzi email, questi vengono spostati automaticamente nella colonna Email.</li><li><b>.pwm / TXT / CSV / XLSX cifrati</b>: vengono riconosciuti da soli e ti viene chiesta la password per aprirli.</li></ul>
<h4>Salvare ed esportare</h4><p>Con <b>Salva / Esporta</b> scegli archivio .pwm, TXT, CSV o XLSX. Con l’opzione AES-256 attiva il contenuto è cifrato dentro al file (AES-256-GCM, chiave derivata dalla password con PBKDF2-SHA256, 300.000 iterazioni). Ad ogni salvataggio cifrato ti viene chiesta la password (con conferma). Non viene memorizzata da nessuna parte, né nel file né nel browser: dopo l’uso viene dimenticata, quindi conservala tu in un posto sicuro.</p>
<p>Un file cifrato in CSV o XLSX appare come una sola colonna di testo: non modificarla, altrimenti non si apre più.</p>
<h4>Sicurezza</h4><ul><li>Lo strumento non usa internet e non invia nulla: i dati restano nel browser finché non li salvi.</li><li><b>Se dimentichi la password non c’è modo di recuperare i dati.</b></li><li>Il file HTML non salva da solo: chiudendo la pagina senza esportare perdi le modifiche.</li><li>Le password copiate vengono rimosse dagli appunti dopo 20 secondi.</li><li>Usa una password lunga e conserva più copie dell’archivio.</li></ul>`},

gd:`<h3>Guide</h3>
<h4>Getting started</h4><p>The tool works right away, even empty: press <b>New</b> and enter title, email, username, password, URL, group and notes. The arrows button in the password field generates a random 20-character password. At the top right you’ll find the language selector (globe) and the light/dark theme switch (sun/moon).</p>
<h4>List: sorting and filtering</h4><ul><li><b>Sorting:</b> click the header of any column to sort it from A to Z; a second click reverses the order (Z–A). Empty cells always stay at the bottom.</li><li><b>Filtering:</b> below the headers there is a row of dropdowns: pick a value to see only the entries that have it. You can combine several filters with the text search; the <b>X</b> at the end of the row clears them all. “(empty)” shows entries where that field is not filled in.</li></ul>
<h4>Security summary</h4><ul><li>Percentage of accounts with MFA, with weak passwords (under 12 characters) and with reused passwords.</li><li><b>Email</b>: how many accounts depend on each address and domain. The higher, the greater the exposure if that address is compromised.</li><li><b>Username</b>: which usernames are repeated across accounts; a reused username is the first piece of data an attacker tries everywhere.</li><li><b>Expirations</b> and <b>password age</b>, computed only on accounts where the (optional) date is present.</li><li>With hundreds of entries the tables show the first rows and tell you how many more remain.</li></ul>
<h4>Importing</h4><ul><li><b>CSV / XLSX</b>: use the template you can download with the buttons at the bottom of this guide. One row per account; the first row holds the column names (Group, Title, Email address, Username, Password, URL, Notes, MFA, Added, Expires) and must not be changed. In MFA write Yes or No; dates are written as YYYY-MM-DD (or DD/MM/YYYY, day first) and may be left empty. Delete the example row before importing. Italian headers and KeePass export headers are also accepted.</li><li>If the file has only a “User” or “Username” column and it contains email addresses, they are moved to the Email column automatically.</li><li><b>Encrypted .pwm / TXT / CSV / XLSX</b>: they are recognized automatically and you are asked for the password to open them.</li></ul>
<h4>Saving and exporting</h4><p>With <b>Save / Export</b> choose the .pwm archive, TXT, CSV or XLSX. With the AES-256 option on, the content is encrypted inside the file (AES-256-GCM, key derived from the password with PBKDF2-SHA256, 300,000 iterations). Each encrypted save asks for the password (with confirmation). It is not stored anywhere, neither in the file nor in the browser: it is forgotten after use, so keep it somewhere safe.</p>
<p>An encrypted CSV or XLSX file shows as a single column of text: don’t edit it, or it won’t open anymore.</p>
<h4>Security</h4><ul><li>The tool doesn’t use the internet and sends nothing: data stays in the browser until you save it.</li><li><b>If you forget the password, there is no way to recover the data.</b></li><li>The HTML file doesn’t save by itself: closing the page without exporting loses your changes.</li><li>Copied passwords are cleared from the clipboard after 20 seconds.</li><li>Use a long password and keep several copies of the archive.</li></ul>`}};

function pcsv(t){const l=t.split('\n')[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';let R=[],r=[],c='',q=0;

else if(h=='"')q=1;else if(h==d){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}
if(c||r.length){r.push(c);R.push(r)}return R}
const csv=R=>R.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
/* XLSX lettura */
async function inflate(u){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
async function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf),F={};let e=u.length-22;while(e>0&&v.getUint32(e,true)!=0x06054b50)e--;

S=ss?[...ss.getElementsByTagName('si')].map(tx):[],sk=F['xl/worksheets/sheet1.xml']?'xl/worksheets/sheet1.xml':Object.keys(F).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));

ci=[...m[1]].reduce((a,x)=>a*26+x.charCodeAt(0)-64,0)-1,ri=+m[2]-1;(R[ri]=R[ri]||[])[ci]=ty=='s'?S[+vv.textContent]:ty=='inlineStr'?tx(c):vv?vv.textContent:''}

/* XLSX scrittura */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(const b of u)c=crcT[(c^b)&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const P=[],C=[];let off=0;
for(const[n,s]of Object.entries(files)){const nb=enc.encode(n),d=enc.encode(s),c=crc(d),h=new DataView(new ArrayBuffer(30)),g=new DataView(new ArrayBuffer(46));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,off,true);
P.push(new Uint8Array(h.buffer),nb,d);C.push(new Uint8Array(g.buffer),nb);off+=30+nb.length+d.length}
const e=new DataView(new ArrayBuffer(22)),k=C.length/2;e.setUint32(0,0x06054b50,true);e.setUint16(8,k,true);e.setUint16(10,k,true);e.setUint32(12,C.reduce((a,x)=>a+x.length,0),true);e.setUint32(16,off,true);

const xe=x=>String(x??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
