gd:`<h3>Guida</h3>
<h4>Come iniziare</h4><p>Il file funziona subito, anche vuoto: premi <b>Nuovo</b> e inserisci titolo, utente, password, URL, gruppo e note. Il pulsante con le frecce nel campo password genera una password casuale di 20 caratteri. La lingua si cambia dall’icona del globo in alto.</p>
<h4>Elenco e riepilogo</h4><ul><li>Clicca sulle intestazioni Titolo, Gruppo, Utente, URL, MFA, Inserimento o Scadenza per ordinare l’elenco (secondo clic: ordine inverso).</li><li>Il pulsante <b>Riepilogo</b> mostra la percentuale di account con MFA, di password deboli (meno di 12 caratteri) e riutilizzate, e quanti account dipendono da ciascun indirizzo email o dominio: più è alto, maggiore è l’esposizione se quell’indirizzo viene compromesso.</li><li>Le date di inserimento e di scadenza sono <b>facoltative</b> (puoi compilarne una, entrambe o nessuna). Con esse il Riepilogo mostra due report: uno sulle scadenze (scadute, entro 30 giorni, entro 90 giorni) e uno sull’anzianità delle password, per capire da quanto tempo non vengono cambiate. Ogni report considera solo gli account in cui la data è presente.</li></ul>
<h4>Importare</h4><ul><li><b>CSV / XLSX</b>: usa il modello che puoi scaricare con i pulsanti in fondo a questa guida. Una riga per account; la prima riga contiene i nomi delle colonne (Gruppo, Titolo, Utente, Password, URL, Note, MFA, Inserimento, Scadenza) e non va modificata. Nella colonna MFA scrivi Sì oppure No; le date vanno scritte come AAAA-MM-GG (o GG/MM/AAAA) e possono restare vuote. Cancella la riga di esempio prima di importare. Sono accettate anche le intestazioni inglesi e quelle dell’export di KeePass.</li><li><b>.pwm / TXT / CSV / XLSX cifrati</b>: vengono riconosciuti da soli e ti viene chiesta la password per aprirli.</li></ul>
<h4>Salvare ed esportare</h4><p>Con <b>Salva / Esporta</b> scegli TXT, PDF, CSV, XLSX o l’archivio .pwm. Con l’opzione AES-256 attiva il contenuto è cifrato dentro al file (AES-256-GCM, chiave derivata dalla password con PBKDF2-SHA256, 300.000 iterazioni). Ad ogni salvataggio cifrato ti viene chiesta la password (con conferma). Non viene memorizzata da nessuna parte, né nel file né nel browser: dopo l’uso viene dimenticata, quindi conservala tu in un posto sicuro.</p>
<p>Un file cifrato in CSV o XLSX appare come una sola colonna di testo: non modificarla, altrimenti non si apre più. I PDF cifrati servono come copia di archivio e non si possono reimportare: per riaprire i dati usa .pwm, TXT, CSV o XLSX.</p>
<h4>Sicurezza</h4><ul><li>Lo strumento non usa internet e non invia nulla: i dati restano nel browser finché non li salvi.</li><li><b>Se dimentichi la password non c’è modo di recuperare i dati.</b></li><li>Il file HTML non salva da solo: chiudendo la pagina senza esportare perdi le modifiche.</li><li>Le password copiate vengono rimosse dagli appunti dopo 20 secondi.</li><li>Usa una password lunga e conserva più copie dell’archivio.</li></ul>`},

gd:`<h3>Guide</h3>
<h4>Getting started</h4><p>The tool works right away, even empty: press <b>New</b> and enter title, username, password, URL, group and notes. The arrows button in the password field generates a random 20-character password. Change the language with the globe icon at the top.</p>
<h4>List and summary</h4><ul><li>Click the Title, Group, Username, URL, MFA, Added or Expires headers to sort the list (second click: reverse order).</li><li>The <b>Summary</b> button shows the percentage of accounts with MFA, with weak passwords (under 12 characters) and with reused passwords, and how many accounts depend on each email address or domain: the higher, the greater the exposure if that address is compromised.</li><li>The date added and expiry date are <b>optional</b> (fill in one, both or neither). With them the Summary shows two reports: one on expirations (expired, within 30 days, within 90 days) and one on password age, to see how long passwords have gone unchanged. Each report only considers accounts where the date is present.</li></ul>
<h4>Importing</h4><ul><li><b>CSV / XLSX</b>: use the template you can download with the buttons at the bottom of this guide. One row per account; the first row holds the column names (Group, Title, Username, Password, URL, Notes, MFA, Added, Expires) and must not be changed. In the MFA column write Yes or No; dates are written as YYYY-MM-DD (or DD/MM/YYYY) and may be left empty. Delete the example row before importing. Italian headers and KeePass export headers are also accepted.</li><li><b>Encrypted .pwm / TXT / CSV / XLSX</b>: they are recognized automatically and you are asked for the password to open them.</li></ul>
<h4>Saving and exporting</h4><p>With <b>Save / Export</b> choose TXT, PDF, CSV, XLSX or the .pwm archive. With the AES-256 option on, the content is encrypted inside the file (AES-256-GCM, key derived from the password with PBKDF2-SHA256, 300,000 iterations). Each encrypted save asks for the password (with confirmation). It is not stored anywhere, neither in the file nor in the browser: it is forgotten after use, so keep it somewhere safe.</p>
<p>An encrypted CSV or XLSX file shows as a single column of text: don’t edit it, or it won’t open anymore. Encrypted PDFs are archive copies and can’t be re-imported: use .pwm, TXT, CSV or XLSX to reopen your data.</p>
<h4>Security</h4><ul><li>The tool doesn’t use the internet and sends nothing: data stays in the browser until you save it.</li><li><b>If you forget the password, there is no way to recover the data.</b></li><li>The HTML file doesn’t save by itself: closing the page without exporting loses your changes.</li><li>Copied passwords are cleared from the clipboard after 20 seconds.</li><li>Use a long password and keep several copies of the archive.</li></ul>`}};

const K={g:/grup|group|folder|cartella/i,u:/user|utente|login|mail/i,p:/pass|pwd/i,l:/url|web|sito|link/i,t:/tit|name|nome|account/i,n:/note|comment|descr/i,m:/mfa|2fa|otp|totp|two.?f|autent/i,x:/scad|expir|valid/i,d:/inser|creat|aggiunt|added/i},I={};
R[0].forEach((h,i)=>{for(const k in K)if(I[k]==null&&K[k].test(h)){I[k]=i;break}});
if(I.p==null){KM.forEach((k,i)=>I[k]=i)}else R=R.slice(1);
return R.map(r=>{const o={id:++uid};KM.forEach(k=>o[k]=I[k]==null?'':String(r[I[k]]??''));o.m=/^(1|true|yes|y|s[iì]|x|on)$/i.test(o.m.trim())?'1':'';o.d=nd(o.d);o.x=nd(o.x);return o})}
$('#fi').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
try{const n=f.name.toLowerCase();let R,a,pw;
if(n.endsWith('.xlsx'))R=await readX(await f.arrayBuffer());
else{const t=dec.decode(await f.arrayBuffer()).replace(/^\uFEFF/,'');if(n.endsWith('.csv'))R=pcsv(t);else{a=arm(t);if(!a)return toast(t('unrec'))}}
if(R)a=arm(R.flat().join(''));
if(a){for(;;){pw=await askPw(0,t('openMsg'));if(pw==null)return;try{R=JSON.parse(await decr(pw,a));break}catch{toast(t('wrong'))}}}
const N=mapRows(R);let rep=0;if(E.length)rep=confirm(t('repQ'));
E=rep?N:[...E,...N];dirty=1;render();toast(N.length+' '+t('imported'))}catch(e){toast(t('readErr'))}};
applyLang();
</script></body></html>
