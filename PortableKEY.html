<h4>Come iniziare</h4><p>Il file funziona subito, anche vuoto: premi <b>Nuovo</b> e inserisci titolo, email, username, password, URL, gruppo e note. Il pulsante con le frecce nel campo password genera una password casuale di 20 caratteri. In alto a destra trovi il selettore della lingua (globo) e l’interruttore tema chiaro/scuro (sole/luna).</p>
<h4>Elenco: ordinare e filtrare</h4><ul><li><b>Ordinare:</b> clicca sull’intestazione di una qualsiasi colonna per ordinarla dalla A alla Z; un secondo clic inverte l’ordine (Z–A). Le celle vuote restano sempre in fondo. La colonna Password si ordina per lunghezza.</li><li><b>Filtrare:</b> sotto le intestazioni c’è una riga di menu a tendina: scegli un valore per vedere solo le voci che lo contengono. Puoi combinare più filtri con la ricerca testuale; la <b>X</b> a fine riga li azzera tutti. “(vuoto)” mostra le voci in cui quel campo non è compilato.</li></ul>
<h4>Riepilogo di sicurezza</h4><ul><li>Percentuale di account con MFA, con password deboli (meno di 12 caratteri) e con password riutilizzate.</li><li><b>Email</b>: quanti account dipendono da ciascun indirizzo e dominio. Più è alto, maggiore è l’esposizione se quell’indirizzo viene compromesso.</li><li><b>Username</b>: quali username sono ripetuti su più account; uno username riutilizzato è il primo dato che un attaccante prova ovunque.</li><li><b>Scadenze</b> e <b>anzianità delle password</b>, calcolate solo sugli account in cui la data (facoltativa) è presente.</li><li>Con centinaia di voci le tabelle mostrano le prime righe e indicano quante altre restano.</li></ul>
<h4>Importare</h4><ul><li><b>CSV / XLSX</b>: usa il modello che puoi scaricare con i pulsanti in fondo a questa guida. Una riga per account; la prima riga contiene i nomi delle colonne (Gruppo, Titolo, Indirizzo email, Username, Password, URL, Note, MFA, Inserimento, Scadenza) e non va modificata. In MFA scrivi Sì oppure No; le date si scrivono AAAA-MM-GG (o GG/MM/AAAA, giorno per primo) e possono restare vuote. Cancella la riga di esempio prima di importare. Sono accettate anche le intestazioni inglesi e quelle dell’export di KeePass.</li><li>Se il file ha solo una colonna “Utente” o “Username” e contiene indirizzi email, questi vengono spostati automaticamente nella colonna Email.</li><li><b>.pwm / TXT / CSV / XLSX cifrati</b>: vengono riconosciuti da soli e ti viene chiesta la password per aprirli.</li></ul>
<h4>Salvare ed esportare</h4><p>Con <b>Salva / Esporta</b> scegli archivio .pwm, TXT, CSV o XLSX. Con l’opzione AES-256 attiva il contenuto è cifrato dentro al file (AES-256-GCM, chiave derivata dalla password con PBKDF2-SHA256, 1.000.000 di iterazioni). Ad ogni salvataggio cifrato ti viene chiesta una password di almeno 12 caratteri (con conferma). Non viene memorizzata da nessuna parte, né nel file né nel browser: dopo l’uso viene dimenticata, quindi conservala tu in un posto sicuro.</p><p>Nella finestra della password trovi un indicatore di robustezza (stima indicativa) e il pulsante <b>Genera frase</b>, che crea 8 parole casuali separate da trattini (circa 80 bit): annotala subito, perché non viene salvata. Una password debole richiede una conferma. Prima di salvare in chiaro, senza cifratura, viene mostrato un avviso.</p>
<p>Un file cifrato in CSV o XLSX appare come una sola colonna di testo: non modificarla, altrimenti non si apre più. Gli archivi creati con le versioni precedenti si aprono ancora e passano al nuovo formato al primo salvataggio cifrato.</p><p>I file esportati hanno nel nome data e ora (password-AAAA-MM-GG_HH-MM), così puoi conservarne più versioni. Nei CSV e XLSX non cifrati i valori che iniziano con = + - @ vengono preceduti da un apice (') per impedire che Excel li interpreti come formule; l’apice viene tolto automaticamente quando reimporti il file in PortableKEY.</p>
<h4>Sicurezza</h4><ul><li>Lo strumento non usa internet e non invia nulla: i dati restano nel browser finché non li salvi.</li><li><b>Se dimentichi la password non c’è modo di recuperare i dati.</b></li><li>Il file HTML non salva da solo: chiudendo la pagina senza esportare perdi le modifiche.</li><li>Le password copiate vengono rimosse dagli appunti dopo 20 secondi.</li><li><b>Blocco automatico:</b> dopo 3 minuti senza attività la pagina chiude le finestre aperte e, se non hai modifiche non salvate, rilascia i dati (per riaprire l’archivio devi importarlo di nuovo con la password). Se hai modifiche non salvate, per non perderle i dati restano in memoria ma vengono nascosti: salva un archivio cifrato per completare il blocco. Rilasciare i dati dalla pagina non garantisce la cancellazione fisica dalla memoria, che dipende dal browser.</li><li><b>Password in memoria:</b> mentre l’archivio è aperto le password sono tenute cifrate in memoria con una chiave casuale di sessione (best effort: chi controlla il browser o la pagina può comunque usarle). Quando le mostri restano visibili solo 15 secondi.</li><li>Una politica di sicurezza dei contenuti (CSP) impedisce alla pagina qualsiasi accesso alla rete.</li><li>Usa una password lunga e conserva più copie dell’archivio.</li></ul>`},

gd:`<h3>Guide</h3>
<h4>Getting started</h4><p>The tool works right away, even empty: press <b>New</b> and enter title, email, username, password, URL, group and notes. The arrows button in the password field generates a random 20-character password. At the top right you’ll find the language selector (globe) and the light/dark theme switch (sun/moon).</p>
<h4>List: sorting and filtering</h4><ul><li><b>Sorting:</b> click the header of any column to sort it from A to Z; a second click reverses the order (Z–A). Empty cells always stay at the bottom. The Password column sorts by length.</li><li><b>Filtering:</b> below the headers there is a row of dropdowns: pick a value to see only the entries that have it. You can combine several filters with the text search; the <b>X</b> at the end of the row clears them all. “(empty)” shows entries where that field is not filled in.</li></ul>
<h4>Security summary</h4><ul><li>Percentage of accounts with MFA, with weak passwords (under 12 characters) and with reused passwords.</li><li><b>Email</b>: how many accounts depend on each address and domain. The higher, the greater the exposure if that address is compromised.</li><li><b>Username</b>: which usernames are repeated across accounts; a reused username is the first piece of data an attacker tries everywhere.</li><li><b>Expirations</b> and <b>password age</b>, computed only on accounts where the (optional) date is present.</li><li>With hundreds of entries the tables show the first rows and tell you how many more remain.</li></ul>
<h4>Importing</h4><ul><li><b>CSV / XLSX</b>: use the template you can download with the buttons at the bottom of this guide. One row per account; the first row holds the column names (Group, Title, Email address, Username, Password, URL, Notes, MFA, Added, Expires) and must not be changed. In MFA write Yes or No; dates are written as YYYY-MM-DD (or DD/MM/YYYY, day first) and may be left empty. Delete the example row before importing. Italian headers and KeePass export headers are also accepted.</li><li>If the file has only a “User” or “Username” column and it contains email addresses, they are moved to the Email column automatically.</li><li><b>Encrypted .pwm / TXT / CSV / XLSX</b>: they are recognized automatically and you are asked for the password to open them.</li></ul>
<h4>Saving and exporting</h4><p>With <b>Save / Export</b> choose the .pwm archive, TXT, CSV or XLSX. With the AES-256 option on, the content is encrypted inside the file (AES-256-GCM, key derived from the password with PBKDF2-SHA256, 1,000,000 iterations). Each encrypted save asks for a password of at least 12 characters (with confirmation). It is not stored anywhere, neither in the file nor in the browser: it is forgotten after use, so keep it somewhere safe.</p><p>In the password window you will find a strength indicator (an estimate) and the <b>Generate phrase</b> button, which creates 8 random words separated by hyphens (about 80 bits): write it down right away, because it is not stored. A weak password asks for confirmation. A warning is shown before saving in plain text, without encryption.</p>
<p>An encrypted CSV or XLSX file shows as a single column of text: don’t edit it, or it won’t open anymore. Archives created with earlier versions still open and are upgraded to the new format on the first encrypted save.</p><p>Exported files carry the date and time in their name (password-YYYY-MM-DD_HH-MM), so you can keep several versions. In unencrypted CSV and XLSX files, values starting with = + - @ are prefixed with an apostrophe (') so spreadsheets don’t interpret them as formulas; the apostrophe is removed automatically when you re-import the file into PortableKEY.</p>
<h4>Security</h4><ul><li>The tool doesn’t use the internet and sends nothing: data stays in the browser until you save it.</li><li><b>If you forget the password, there is no way to recover the data.</b></li><li>The HTML file doesn’t save by itself: closing the page without exporting loses your changes.</li><li>Copied passwords are cleared from the clipboard after 20 seconds.</li><li><b>Auto-lock:</b> after 3 minutes without activity the page closes open dialogs and, if there are no unsaved changes, releases the data (to reopen the archive you must import it again with the password). If you have unsaved changes, to avoid losing them the data stays in memory but is hidden: save an encrypted archive to complete the lock. Releasing the data from the page does not guarantee physical erasure from memory, which depends on the browser.</li><li><b>Passwords in memory:</b> while the archive is open, passwords are kept encrypted in memory with a random session key (best effort: whoever controls the browser or the page can still use them). When you reveal one, it stays visible for only 15 seconds.</li><li>A Content Security Policy (CSP) prevents the page from any network access.</li><li>Use a long password and keep several copies of the archive.</li></ul>`}};
